[versions]
jme = "3.9.0-beta1"
openxrBindingsNative = "1.0.2"
lwjgl3 = "3.3.6" # it is important that this is the same as JME which provides the rest of LWJGL
jsr305 = "3.0.2"
lemur = "1.16.0"
lemurProto = "1.13.0"
minie = "8.2.0"
junit = "5.10.0"
mockito = "5.4.0"
androidGradlePlugin = "9.4.1"
dokka = "2.2.0"

[libraries]
jme3-core = {module="org.jmonkeyengine:jme3-core", version.ref = "jme"}
jme3-desktop = {module="org.jmonkeyengine:jme3-desktop", version.ref = "jme"}
jme3-lwjgl3 = {module="org.jmonkeyengine:jme3-lwjgl3", version.ref = "jme"}
jme3-android = {module="org.jmonkeyengine:jme3-android", version.ref = "jme"}
openxr-bindings-native = { module = "com.onemillionworlds.tamarin:openxr-bindings-native", version.ref = "openxrBindingsNative" }
lwjgl-openxr = { module = "org.lwjgl:lwjgl-openxr", version.ref = "lwjgl3" }
lwjgl-egl = { module = "org.lwjgl:lwjgl-egl", version.ref = "lwjgl3" }
jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }
lemur = { module = "com.simsilica:lemur", version.ref = "lemur" }
lemur-proto = { module = "com.simsilica:lemur-proto", version.ref = "lemurProto" }
minie = { module = "com.github.stephengold:Minie", version.ref = "minie" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }

[plugins]
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
