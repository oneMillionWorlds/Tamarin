plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'com.onemillionworlds'

repositories {
    mavenCentral()
}

java {
    withJavadocJar()
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}


test {
    useJUnitPlatform()
}


dependencies {

    api project(':tamarin-core')

    api libs.lwjgl.openxr

    runtimeOnly(variantOf(libs.lwjgl.openxr) { classifier('natives-windows') })
    runtimeOnly(variantOf(libs.lwjgl.openxr) { classifier('natives-linux') })
    api libs.lwjgl.egl // Necessary for the cross platform XrGraphicsBindingEGLMNDX binding

    implementation libs.jsr305 //for the OverridingMethodsMustInvokeSuper annotation

    /*
     * It is presumed any user of Tamarin will already be using JMonkey but we don't want to force a version on them.
     * That is why this is a compileOnly dependency
     */
    compileOnly libs.jme3.core
    compileOnly libs.jme3.lwjgl3
    compileOnly libs.jme3.desktop
    /*
     * Lemur is an optional dependency
     */
    compileOnly libs.lemur
    compileOnly libs.lemur.proto

    /*
     * Minie is an optional dependency
     */
    compileOnly libs.minie

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.jme3.core
    testImplementation libs.mockito.core
}

publishing { //see https://docs.gradle.org/current/userguide/publishing_maven.html
    publications {
        mavenJava(MavenPublication) {
            groupId = "${group}"
            artifactId = 'tamarin'
            version = "${version}"

            from components.java

            pom {
                name = project.name
                description = 'A VR library that extends the functionality in JMonkeyEngine using OpenXR'
                url = 'https://github.com/oneMillionWorlds/Tamarin'
                licenses {
                    license {
                        name = 'New BSD (3-clause) License'
                        url = 'http://opensource.org/licenses/BSD-3-Clause'
                    }
                }
                scm {
                    connection = 'git@github.com:oneMillionWorlds/Tamarin.git'
                    developerConnection = 'git@github.com:oneMillionWorlds/Tamarin.git'
                    url = 'https://github.com/oneMillionWorlds/Tamarin'
                }
                developers {
                    developer {
                        id = 'RichardTingle'
                        name = 'Richard Tingle (aka richtea)'
                        email = 'support@oneMillionWorlds.com'
                    }
                }
            }
        }
    }
    repositories {
        mavenLocal()
        maven {
            name = 'CentralPortalStaging'
            url = uri("${rootProject.buildDir}/central-portal-staging")
        }
    }
}

signing {
    // Fallback: inject signing.keyId from environment if not provided via properties
    if (!project.hasProperty('signing.keyId')) {
        def envKeyId = System.getenv('SIGNING_KEY_ID')
        if (envKeyId && envKeyId.trim()) {
            project.ext.set('signing.keyId', envKeyId.trim())
        }
    }

    // Only sign when a key is actually configured. Unconditional signing makes publishToMavenLocal fail on a
    // dev machine with no GPG key, because the publication then references .asc files that were never produced.
    if (project.hasProperty('signing.keyId')) {
        sign publishing.publications.mavenJava
    }
}
